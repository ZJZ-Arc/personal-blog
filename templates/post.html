<!DOCTYPE html>
<!--
  ============================================================================
  新文章模板。两种用法：
  1) 自动：node tools/new-post.mjs --title "标题" --tags "教程 工具" --summary "摘要"
     （脚本会把下面的 {{占位符}} 全部替换掉）
  2) 手动：复制这个文件到 posts/ 目录，改名为 your-slug.html，
     然后手动把 {{...}} 全部换掉。搜索 "{{" 能确保没有漏的。
  ============================================================================
-->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 模板文件本身不需要被搜索引擎收录 -->
<meta name="robots" content="noindex">
<script>
  (function () {
    try {
      var saved = localStorage.getItem("blog-theme");
      var theme = (saved === "light" || saved === "dark")
        ? saved
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>

<title>{{TITLE}} · Arc.desktop的小窝</title>
<meta name="description" content="{{SUMMARY}}">
<link rel="canonical" href="https://zjz-arc.github.io/personal-blog/posts/{{SLUG}}.html">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="og:url" content="https://zjz-arc.github.io/personal-blog/posts/{{SLUG}}.html">
<meta property="article:published_time" content="{{DATE}}">

<link rel="alternate" type="application/rss+xml" title="Arc.desktop的小窝 · RSS" href="../feed.xml">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../index.html">Arc.desktop的小窝</a>
    <nav class="nav" aria-label="主导航">
      <a href="../index.html">首页</a>
      <a href="../tags.html">标签</a>
      <a href="../about.html">关于</a>
      <a href="../feed.xml">RSS</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main">
  <article class="article">
    <header class="article-header">
      <h1>{{TITLE}}</h1>
      <div class="post-meta">
        <time datetime="{{DATE}}">{{DATE_DISPLAY}}</time>
        <span class="dot">·</span>
        <span>约 5 分钟读完</span>
        <span class="dot">·</span>
        <span class="tags">
          {{TAG_LINKS}}
        </span>
      </div>
    </header>

    <div class="prose">
      <!-- ✍️ 正文贴在这里。可用的样式：h2/h3、p、ul/ol/li、blockquote、
           pre>code（代码块）、code（行内代码）、hr、table、img -->
      <p>在这里写第一段。</p>
    </div>
  </article>

  <div class="article-footer">
    <a href="../index.html">← 返回文章列表</a>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 Arc.desktop的小窝 · 用纯 HTML / CSS / JavaScript 搭成</span>
    <span><a href="../index.html">首页</a></span>
  </div>
</footer>

<script src="../assets/main.js"></script>
</body>
</html>
