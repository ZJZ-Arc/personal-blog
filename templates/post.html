<!DOCTYPE html>
<!--
  ============================================================================
  新文章模板。两种用法：
  1) 自动：node tools/new-post.mjs --title "标题" --tags "教程 工具" --summary "摘要"
     （脚本会把下面的 {{占位符}} 全部替换掉）
  2) 手动：复制这个文件到 posts/ 目录，改名为 your-slug.html，
     然后手动把 {{...}} 全部换掉。搜索 "{{" 能确保没有漏的。

  版式说明：左侧导航、中间卡片、右侧目录。目录由 assets/main.js 从正文的
  h2 / h3 自动生成，不需要你手写；阅读时长也是自动算的。
  ============================================================================
-->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 模板文件本身不需要被搜索引擎收录 -->
<meta name="robots" content="noindex">
<script>
  (function () {
    try {
      var saved = localStorage.getItem("blog-theme");
      var theme = (saved === "light" || saved === "dark")
        ? saved
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>

<title>{{TITLE}} · Arc.desktop的小窝</title>
<meta name="description" content="{{SUMMARY}}">
<link rel="canonical" href="https://zjz-arc.github.io/personal-blog/posts/{{SLUG}}.html">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="og:url" content="https://zjz-arc.github.io/personal-blog/posts/{{SLUG}}.html">
<meta property="article:published_time" content="{{DATE}}">
<meta name="theme-color" content="#e8f1fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b2a3a" media="(prefers-color-scheme: dark)">

<link rel="alternate" type="application/rss+xml" title="Arc.desktop的小窝 · RSS" href="../feed.xml">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="article-page">
<a class="skip-link" href="#main">跳到正文</a>

<div class="container main-container">

  <aside class="sidebar left-sidebar sticky">
    <header>
      <figure class="site-avatar">
        <a href="../index.html"><img src="../assets/avatar.jpg" class="site-logo" width="320" height="320" alt="站点头像"></a>
        <span class="emoji">💻</span>
      </figure>
      <div class="site-meta">
        <div class="site-name"><a href="../index.html">Arc.desktop的小窝</a></div>
        <div class="site-description">记录与折腾</div>
      </div>
    </header>

    <ol class="menu-social">
      <li><a href="https://github.com/ZJZ-Arc" target="_blank" rel="me" title="GitHub"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg></a></li>
    </ol>

    <nav class="menu" id="main-menu" aria-label="主导航">
      <ul>
        <li><a href="../index.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12H3l9-9 9 9h-2"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6"/></svg><span>首页</span></a></li>
        <li><a href="../tags.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3H5a2 2 0 0 0-2 2v6l9 9a2 2 0 0 0 3 0l5-5a2 2 0 0 0 0-3z"/><circle cx="7.5" cy="7.5" r="1"/></svg><span>标签</span></a></li>
        <li><a href="../about.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg><span>关于</span></a></li>
        <li><a href="../feed.xml"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="19" r="1"/><path d="M4 4a16 16 0 0 1 16 16"/><path d="M4 11a9 9 0 0 1 9 9"/></svg><span>RSS</span></a></li>
      </ul>
      <ul>
        <li class="menu-bottom-section">
          <button type="button" id="dark-mode-toggle" data-theme-toggle aria-label="切换主题">
            <svg class="icon icon-toggle-left" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="2"/><rect x="2" y="6" width="20" height="12" rx="6"/></svg>
            <svg class="icon icon-toggle-right" viewBox="0 0 24 24" aria-hidden="true"><circle cx="16" cy="12" r="2"/><rect x="2" y="6" width="20" height="12" rx="6"/></svg>
            <span>暗色模式</span>
          </button>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="main" id="main">
    <article class="main-article">
      <header class="article-header">
        <div class="article-details">
          <header class="article-category">
          {{TAG_LINKS}}
          </header>
          <h1 class="article-title">{{TITLE}}</h1>
          <p class="article-subtitle">{{SUMMARY}}</p>
          <footer class="article-time">
            <div><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg><time datetime="{{DATE}}">{{DATE_DISPLAY}}</time></div>
            <div><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg><span>阅读时长: <span data-reading-time>—</span> 分钟</span></div>
          </footer>
        </div>
      </header>

      <div class="article-content">
        <!-- ✍️ 正文贴在这里。可用的写法：
             h2 / h3（会自动进右侧目录）、p、ul / ol / li、
             blockquote、pre>code（代码块）、code（行内代码）、hr、table、img。
             正文里的链接写成 <a class="link" href="...">，会带一条下划线高亮。 -->
        <p>在这里写第一段。</p>
      </div>

      <footer class="article-footer">
        <section class="article-tags">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3H5a2 2 0 0 0-2 2v6l9 9a2 2 0 0 0 3 0l5-5a2 2 0 0 0 0-3z"/><circle cx="7.5" cy="7.5" r="1"/></svg>
          {{TAG_LINKS}}
        </section>
      </footer>
    </article>

    <!-- 相关文章：把另外两篇的标题和日期换进来 -->
    <aside class="related-content--wrapper">
      <h2 class="section-title">相关文章</h2>
      <div class="related-content">
        <div class="article-list--tile">
          <article class="has-image">
            <a href="../posts/hello-world.html">
              <h2 class="article-title">为什么我要有一个自己的博客</h2>
              <time datetime="2026-10-12">2026年10月12日</time>
            </a>
          </article>
          <article class="has-image">
            <a href="../posts/how-this-blog-works.html">
              <h2 class="article-title">这个博客是怎么搭起来的：零依赖三件套</h2>
              <time datetime="2026-10-10">2026年10月10日</time>
            </a>
          </article>
        </div>
      </div>
    </aside>

    <footer class="site-footer">
      <section class="copyright">© 2026 Arc.desktop的小窝</section>
      <section class="powerby">
        用纯 HTML / CSS / JavaScript 手写 · 视觉风格参照
        <a href="https://github.com/CaiJimmy/hugo-theme-stack" target="_blank" rel="noopener">Hugo Stack</a>
      </section>
    </footer>
  </main>

  <aside class="sidebar right-sidebar sticky">
    <section class="widget archives" data-toc-widget>
      <div class="widget-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="9" x2="19" y2="9"/><line x1="5" y1="15" x2="19" y2="15"/><line x1="11" y1="4" x2="7" y2="20"/><line x1="17" y1="4" x2="13" y2="20"/></svg></div>
      <h2 class="widget-title section-title">目录</h2>
      <div class="widget--toc"><nav id="TableOfContents" data-toc aria-label="文章目录"></nav></div>
    </section>
  </aside>

</div>

<script src="../assets/main.js"></script>
</body>
</html>
