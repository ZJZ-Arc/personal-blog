<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="站点头像">
  <!-- 换成自己的照片时：把这张图片替换掉即可，宽高保持正方形效果最好 -->
  <defs>
    <linearGradient id="avatar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a6b8a"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#avatar-bg)"/>
  <circle cx="150" cy="150" r="118" fill="none" stroke="#ecf0f1" stroke-opacity="0.28" stroke-width="3"/>
  <text x="150" y="150" text-anchor="middle" dominant-baseline="central"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="132" font-weight="700"
        fill="#ecf0f1">A</text>
</svg>
